      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
      <!-- Custom CSS for Landing Page -->
      <style>
         :root {
         --primary: #d4a373;
         --secondary: #faedcd;
         --dark: #121212;
         --text: #fdfdfd;
         --glass-bg: rgba(18, 18, 18, 0.65);
         --glass-border: rgba(255, 255, 255, 0.1);
         }
         * {
         margin: 0;
         padding: 0;
         box-sizing: border-box;
         }
         body {
         font-family: 'Inter', sans-serif;
         color: var(--text);
         background-color: var(--dark);
         min-height: 100vh;
         display: flex;
         flex-direction: column;
         overflow-x: hidden;
         }
         /* Background with Overlay */
         .hero-bg {
         position: fixed;
         top: 0;
         left: 0;
         width: 100%;
         height: 100%;
         z-index: -1;
         background-image: url('assets/images/hero.png');
         /* If available from existing files */
         background-size: cover;
         background-position: center;
         background-repeat: no-repeat;
         filter: blur(8px);
         transform: scale(1.1);
         }
         .bg-overlay {
         position: fixed;
         top: 0;
         left: 0;
         width: 100%;
         height: 100%;
         background: linear-gradient(135deg, rgba(10, 10, 10, 0.8) 0%, rgba(30, 20, 10, 0.9) 100%);
         z-index: -1;
         }
         /* Container */
         .container {
         flex: 1;
         display: flex;
         justify-content: center;
         align-items: center;
         padding: 2rem;
         position: relative;
         }
         /* Glassmorphism Card */
         .glass-card {
         background: var(--glass-bg);
         backdrop-filter: blur(16px);
         -webkit-backdrop-filter: blur(16px);
         border: 1px solid var(--glass-border);
         border-radius: 24px;
         padding: 4rem 3rem;
         max-width: 600px;
         width: 100%;
         text-align: center;
         box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
         animation: floatUp 1s ease-out forwards;
         opacity: 0;
         transform: translateY(30px);
         }
         /* Typography */
         .brand {
         font-family: 'Fraunces', serif;
         font-size: 2.5rem;
         font-weight: 600;
         color: var(--primary);
         margin-bottom: 0.5rem;
         display: flex;
         flex-direction: column;
         align-items: center;
         gap: 10px;
         }
         .brand img {
         width: 60px;
         height: auto;
         object-fit: contain;
         filter: drop-shadow(0 0 10px rgba(212, 163, 115, 0.4));
         }
         .brand em {
         font-style: italic;
         color: var(--secondary);
         font-weight: 300;
         }
         .title {
         font-family: 'Fraunces', serif;
         font-size: 3.5rem;
         line-height: 1.3;
         padding-bottom: 0.2em;
         margin: 1.5rem 0 1rem;
         font-weight: 700;
         background: linear-gradient(to right, #fff, var(--primary));
         -webkit-background-clip: text;
         background-clip: text;
         -webkit-text-fill-color: transparent;
         animation: glow 3s ease-in-out infinite alternate;
         }
         .subtitle {
         font-size: 1.1rem;
         color: #ccc;
         margin-bottom: 2.5rem;
         font-weight: 300;
         line-height: 1.6;
         }
         /* Countdown */
         .countdown {
         display: flex;
         justify-content: center;
         gap: 1.5rem;
         margin-bottom: 3rem;
         }
         .time-box {
         display: flex;
         flex-direction: column;
         align-items: center;
         background: rgba(255, 255, 255, 0.05);
         border: 1px solid rgba(255, 255, 255, 0.1);
         border-radius: 12px;
         padding: 1rem;
         min-width: 80px;
         transition: transform 0.3s ease, border-color 0.3s ease;
         }
         .time-box:hover {
         transform: translateY(-5px);
         border-color: var(--primary);
         background: rgba(212, 163, 115, 0.1);
         }
         .time {
         font-family: 'Fraunces', serif;
         font-size: 2.5rem;
         font-weight: 700;
         color: var(--primary);
         line-height: 1;
         }
         .label {
         font-size: 0.75rem;
         text-transform: uppercase;
         letter-spacing: 2px;
         margin-top: 0.5rem;
         color: #999;
         }
         /* Waitlist Form */
         .waitlist-text {
         font-size: 0.95rem;
         color: var(--secondary);
         margin-bottom: 1rem;
         font-weight: 500;
         letter-spacing: 0.5px;
         }
         .notify-form {
         position: relative;
         max-width: 440px;
         margin: 0 auto 2rem;
         }
         .notify-input {
         width: 100%;
         padding: 1rem 1.5rem;
         padding-right: 120px;
         border-radius: 50px;
         border: 1px solid rgba(255, 255, 255, 0.2);
         background: rgba(0, 0, 0, 0.3);
         color: #fff;
         font-size: 1rem;
         font-family: 'Inter', sans-serif;
         outline: none;
         transition: all 0.3s ease;
         }
         .notify-input:focus {
         border-color: var(--primary);
         background: rgba(0, 0, 0, 0.5);
         box-shadow: 0 0 15px rgba(212, 163, 115, 0.3);
         }
         .notify-btn {
         position: absolute;
         right: 5px;
         top: 5px;
         bottom: 5px;
         padding: 0 1.5rem;
         border-radius: 40px;
         border: none;
         background: var(--primary);
         color: var(--dark);
         font-weight: 600;
         cursor: pointer;
         font-size: 0.9rem;
         transition: all 0.3s ease;
         }
         .notify-btn:hover {
         background: var(--secondary);
         transform: scale(1.05);
         }
         /* Socials */
         .social-links {
         display: flex;
         justify-content: center;
         gap: 1.5rem;
         }
         .social-links a {
         color: #aaa;
         font-size: 1.5rem;
         transition: color 0.3s ease, transform 0.3s ease;
         }
         .social-links a:hover {
         color: var(--primary);
         transform: translateY(-3px);
         }
         /* Animations */
         @keyframes floatUp {
         0% {
         opacity: 0;
         transform: translateY(40px);
         }
         100% {
         opacity: 1;
         transform: translateY(0);
         }
         }
         @keyframes glow {
         0% {
         filter: drop-shadow(0 0 5px rgba(212, 163, 115, 0.2));
         }
         100% {
         filter: drop-shadow(0 0 15px rgba(212, 163, 115, 0.6));
         }
         }
         /* Particles */
         .particles {
         position: fixed;
         top: 0;
         left: 0;
         width: 100%;
         height: 100%;
         pointer-events: none;
         z-index: 0;
         }
         .particle {
         position: absolute;
         background: rgba(212, 163, 115, 0.4);
         border-radius: 50%;
         animation: float 15s infinite linear;
         }
         @keyframes float {
         0% {
         transform: translateY(100vh) scale(0);
         opacity: 0;
         }
         10% {
         opacity: 1;
         }
         90% {
         opacity: 1;
         }
         100% {
         transform: translateY(-10vh) scale(1);
         opacity: 0;
         }
         }
         /* Responsive Compact Mode */
         @media (max-height: 800px),
         (max-width: 600px) {
         body {
         overflow: hidden;
         }
         .container {
         padding: 1rem;
         }
         .glass-card {
         padding: 1.5rem 2rem;
         }
         .brand {
         font-size: 1.8rem;
         flex-direction: row;
         justify-content: center;
         margin-bottom: 0;
         }
         .brand img {
         width: 45px;
         margin-right: 10px;
         }
         .brand em {
         font-size: 1.5rem;
         }
         .title {
         font-size: 2.5rem;
         margin: 0.5rem 0 0.5rem;
         line-height: 1.3;
         padding-bottom: 0.1em;
         }
         .subtitle {
         margin-bottom: 1.25rem;
         font-size: 0.95rem;
         line-height: 1.4;
         }
         .countdown {
         margin-bottom: 1.5rem;
         gap: 0.75rem;
         }
         .time-box {
         min-width: 65px;
         padding: 0.5rem;
         }
         .time {
         font-size: 1.6rem;
         }
         .label {
         margin-top: 0.25rem;
         font-size: 0.65rem;
         }
         .waitlist-text {
         margin-bottom: 0.5rem;
         font-size: 0.85rem;
         }
         .notify-form {
         margin: 0 auto 1rem;
         max-width: 100%;
         }
         .notify-input {
         padding: 0.75rem 1rem;
         padding-right: 120px;
         font-size: 0.9rem;
         }
         .notify-btn {
         padding: 0 1rem;
         font-size: 0.85rem;
         right: 4px;
         top: 4px;
         bottom: 4px;
         }
         .social-links {
         gap: 1.25rem;
         }
         .social-links a {
         font-size: 1.3rem;
         }
         }
      </style>
   </head>
   <body>
      <!-- Background -->
      <div class="hero-bg"></div>
      <div class="bg-overlay"></div>
      <!-- Floating Particles Container -->
      <div class="particles" id="particles"></div>
      <!-- Main Content -->
      <div class="container">
         <div class="glass-card">
            <div class="brand">
               <img src="assets/images/logo.png" alt="Logo" onerror="this.style.display='none'">
               <span>Noumeer <em>Delights</em></span>
            </div>
            <h1 class="title">Opening Soon!</h1>
            <p class="subtitle">Freshly baked goodness is on its way from Noumeer Delights. Happiness is almost ready.</p>
            <!-- Countdown Timer -->
            <div class="countdown" id="countdown">
               <div class="time-box">
                  <span class="time" id="days">00</span>
                  <span class="label">Days</span>
               </div>
               <div class="time-box">
                  <span class="time" id="hours">00</span>
                  <span class="label">Hours</span>
               </div>
               <div class="time-box">
                  <span class="time" id="mins">00</span>
                  <span class="label">Mins</span>
               </div>
               <div class="time-box">
                  <span class="time" id="secs">00</span>
                  <span class="label">Secs</span>
               </div>
            </div>
            <!-- Waitlist Form -->
            <form class="notify-form" id="notifyForm">
               <p class="waitlist-text"><i class="fas fa-gem" style="color:var(--primary); margin-right:5px;"></i> Join the
                  waitlist for exclusive launch offers !
               </p>
               <div style="position: relative;">
                  <input type="email" name="email" class="notify-input" placeholder="Enter your email address" required>
                  <button type="submit" class="notify-btn">Join Now</button>
               </div>
            </form>
            <!-- Socials -->
            <div class="social-links">
               <a href="https://www.instagram.com/noumeer_delights/" target="_blank" aria-label="Instagram"><i
                  class="fab fa-instagram"></i></a>
               <a href="https://wa.me/918976108492" target="_blank" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
            </div>
         </div>
      </div>
      <script>
         // --- Countdown Timer Logic ---
         // Set your exact opening date and time here
         const launchDate = new Date("May 15, 2026 10:00:00").getTime();
         
         
         function updateCountdown() {
           const now = new Date().getTime();
           const distance = launchDate - now;
         
           if (distance < 0) return; // Stop if passed
         
           const days = Math.floor(distance / (1000 * 60 * 60 * 24));
           const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
           const mins = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
           const secs = Math.floor((distance % (1000 * 60)) / 1000);
         
           document.getElementById('days').innerText = String(days).padStart(2, '0');
           document.getElementById('hours').innerText = String(hours).padStart(2, '0');
           document.getElementById('mins').innerText = String(mins).padStart(2, '0');
           document.getElementById('secs').innerText = String(secs).padStart(2, '0');
         }
         
         setInterval(updateCountdown, 1000);
         updateCountdown();
         
         // --- Particle Animation ---
         const particlesContainer = document.getElementById('particles');
         const particleCount = 20;
         
         for (let i = 0; i < particleCount; i++) {
           createParticle();
         }
         
         function createParticle() {
           const particle = document.createElement('div');
           particle.classList.add('particle');
         
           const size = Math.random() * 8 + 2;
           const posX = Math.random() * 100;
           const delay = Math.random() * 10;
           const duration = Math.random() * 10 + 10;
         
           particle.style.width = `${size}px`;
           particle.style.height = `${size}px`;
           particle.style.left = `${posX}vw`;
           particle.style.animationDelay = `${delay}s`;
           particle.style.animationDuration = `${duration}s`;
         
           particlesContainer.appendChild(particle);
         }
         
         // --- Web3Forms Submission Logic ---
         document.getElementById('notifyForm').addEventListener('submit', (e) => {
           e.preventDefault();
           const btn = e.target.querySelector('button');
           const originalText = btn.innerText;
         
           // TODO: Get your free Access Key from https://web3forms.com and paste it below
           const accessKey = "4a990910-d1e4-4a0e-a4be-721a6eb04407";
         
           if (accessKey === "YOUR_WEB3FORMS_ACCESS_KEY_HERE") {
             alert("Hey! Please replace 'YOUR_WEB3FORMS_ACCESS_KEY_HERE' in the code with your actual Web3Forms Access Key to start receiving emails!");
             return;
           }
         
           const formData = new FormData(e.target);
           formData.append("access_key", accessKey);
           formData.append("subject", "New Waitlist Signup!");
           formData.append("from_name", "Noumeer Delights Waitlist");
         
           btn.innerText = 'Sending...';
         
           fetch("https://api.web3forms.com/submit", {
             method: "POST",
             body: formData
           })
             .then(async (response) => {
               if (response.status == 200) {
                 btn.innerText = 'Added!';
                 btn.style.background = '#28a745';
                 btn.style.color = '#fff';
                 setTimeout(() => {
                   btn.innerText = originalText;
                   btn.style.background = 'var(--primary)';
                   btn.style.color = 'var(--dark)';
                   e.target.reset();
                 }, 3000);
               } else {
                 btn.innerText = 'Error!';
                 btn.style.background = '#dc3545';
                 btn.style.color = '#fff';
                 setTimeout(() => {
                   btn.innerText = originalText;
                   btn.style.background = 'var(--primary)';
                   btn.style.color = 'var(--dark)';
                 }, 3000);
               }
             })
             .catch(error => {
               console.error("Error:", error);
               btn.innerText = 'Error!';
               btn.style.background = '#dc3545';
               btn.style.color = '#fff';
               setTimeout(() => {
                 btn.innerText = originalText;
                 btn.style.background = 'var(--primary)';
                 btn.style.color = 'var(--dark)';
               }, 3000);
             });
         });
      </script>
   </body>
